[package]
name = "datv-tx"
version = "0.1.0"
edition = "2021"
description = "ESP32-DATV transmitter for Windows with a choice of video codec (H.264, HEVC, H.266, AV1); FFmpeg encodes"
license-file = "LICENSE"
repository = "https://github.com/CasualArclamp/ESP32-DATV-TX"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"
serialport = { version = "4.10", default-features = false }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
